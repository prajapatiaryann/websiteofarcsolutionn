<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 80" id="ironman-flyer">
  <defs>
    <filter id="suit-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="thruster-glow-filter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="thruster-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chest-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- === BODY === -->
  <!-- Torso -->
  <rect x="16" y="22" width="16" height="24" rx="3" fill="#00d4ff" opacity="0.9" filter="url(#suit-glow)"/>

  <!-- Chest plate highlight -->
  <rect x="18" y="23" width="12" height="10" rx="2" fill="#00d4ff" opacity="0.5"/>

  <!-- === HEAD === -->
  <!-- Helmet base -->
  <ellipse cx="24" cy="16" rx="8" ry="9" fill="#00d4ff" opacity="0.9" filter="url(#suit-glow)"/>

  <!-- Faceplate visor -->
  <ellipse cx="24" cy="16" rx="5.5" ry="3.5" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="0.5"/>

  <!-- Visor glow eyes -->
  <ellipse cx="21.5" cy="15.5" rx="1.5" ry="1" fill="#ffffff" opacity="0.95" filter="url(#suit-glow)"/>
  <ellipse cx="26.5" cy="15.5" rx="1.5" ry="1" fill="#ffffff" opacity="0.95" filter="url(#suit-glow)"/>

  <!-- Helmet chin -->
  <rect x="20" y="21" width="8" height="3" rx="1" fill="#00d4ff" opacity="0.7"/>

  <!-- === ARC REACTOR (Chest) === -->
  <circle cx="24" cy="32" r="3" fill="url(#chest-grad)" filter="url(#suit-glow)"/>
  <circle cx="24" cy="32" r="1.5" fill="white" opacity="0.9"/>

  <!-- === SHOULDERS === -->
  <ellipse cx="12" cy="27" rx="5" ry="4" fill="#00d4ff" opacity="0.85" filter="url(#suit-glow)"/>
  <ellipse cx="36" cy="27" rx="5" ry="4" fill="#00d4ff" opacity="0.85" filter="url(#suit-glow)"/>

  <!-- === ARMS (swept back for flight pose) === -->
  <!-- Left arm swept back -->
  <path d="M14 28 Q6 32 2 40" stroke="#00d4ff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#suit-glow)"/>
  <!-- Left forearm/hand repulsor -->
  <circle cx="2" cy="40" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="2" cy="40" r="1.5" fill="white" opacity="0.9" filter="url(#suit-glow)"/>

  <!-- Right arm swept back -->
  <path d="M34 28 Q42 32 46 40" stroke="#00d4ff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#suit-glow)"/>
  <!-- Right forearm/hand repulsor -->
  <circle cx="46" cy="40" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="46" cy="40" r="1.5" fill="white" opacity="0.9" filter="url(#suit-glow)"/>

  <!-- === LEGS === -->
  <!-- Left leg -->
  <rect x="16" y="44" width="6" height="18" rx="3" fill="#00d4ff" opacity="0.88" filter="url(#suit-glow)"/>
  <!-- Right leg -->
  <rect x="26" y="44" width="6" height="18" rx="3" fill="#00d4ff" opacity="0.88" filter="url(#suit-glow)"/>

  <!-- Knee joints -->
  <ellipse cx="19" cy="53" rx="4" ry="2.5" fill="#00d4ff" opacity="0.6"/>
  <ellipse cx="29" cy="53" rx="4" ry="2.5" fill="#00d4ff" opacity="0.6"/>

  <!-- === THRUSTERS (feet) === -->
  <!-- Left thruster housing -->
  <ellipse cx="19" cy="62" rx="4" ry="2" fill="#005a7a" stroke="#00d4ff" stroke-width="0.5"/>
  <!-- Right thruster housing -->
  <ellipse cx="29" cy="62" rx="4" ry="2" fill="#005a7a" stroke="#00d4ff" stroke-width="0.5"/>

  <!-- Left thruster glow flame -->
  <ellipse class="thruster-glow" cx="19" cy="65" rx="3" ry="4" fill="url(#thruster-grad)" filter="url(#thruster-glow-filter)" opacity="0.9"/>
  <!-- Right thruster glow flame -->
  <ellipse class="thruster-glow" cx="29" cy="65" rx="3" ry="4" fill="url(#thruster-grad)" filter="url(#thruster-glow-filter)" opacity="0.9"/>

  <!-- Inner thruster core -->
  <ellipse cx="19" cy="64" rx="1.5" ry="2" fill="white" opacity="0.95"/>
  <ellipse cx="29" cy="64" rx="1.5" ry="2" fill="white" opacity="0.95"/>

  <!-- === SUIT DETAIL LINES === -->
  <!-- Chest panel lines -->
  <line x1="20" y1="27" x2="20" y2="38" stroke="rgba(0,212,255,0.3)" stroke-width="0.5"/>
  <line x1="28" y1="27" x2="28" y2="38" stroke="rgba(0,212,255,0.3)" stroke-width="0.5"/>

  <!-- Back panel lines (wing effect) -->
  <path d="M14 24 Q4 20 2 12" stroke="rgba(0,212,255,0.4)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M34 24 Q44 20 46 12" stroke="rgba(0,212,255,0.4)" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
