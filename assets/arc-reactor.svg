<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" id="intro-reactor">
  <defs>
    <filter id="center-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background ambient glow -->
  <circle cx="100" cy="100" r="98" fill="url(#bg-glow)"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#ring-glow)"/>

  <!-- Tick marks on outer ring (8 evenly spaced) -->
  <g stroke="#00d4ff" stroke-width="2" opacity="0.9">
    <line x1="100" y1="5" x2="100" y2="18"/>
    <line x1="100" y1="182" x2="100" y2="195"/>
    <line x1="5" y1="100" x2="18" y2="100"/>
    <line x1="182" y1="100" x2="195" y2="100"/>
    <line x1="32.3" y1="32.3" x2="41.5" y2="41.5"/>
    <line x1="158.5" y1="158.5" x2="167.7" y2="167.7"/>
    <line x1="167.7" y1="32.3" x2="158.5" y2="41.5"/>
    <line x1="32.3" y1="167.7" x2="41.5" y2="158.5"/>
  </g>

  <!-- Middle ring -->
  <circle cx="100" cy="100" r="70" stroke="rgba(0,212,255,0.5)" stroke-width="1" fill="none"/>

  <!-- Secondary detail ring -->
  <circle cx="100" cy="100" r="58" stroke="rgba(0,212,255,0.25)" stroke-width="0.5" fill="none" stroke-dasharray="4 4"/>

  <!-- Inner hexagon -->
  <polygon points="100,44 148.5,72 148.5,128 100,156 51.5,128 51.5,72"
           stroke="#00d4ff" stroke-width="1.5" fill="rgba(0,212,255,0.04)" opacity="0.9"/>

  <!-- 6 triangular blades pointing inward -->
  <g fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-width="0.8" opacity="0.85">
    <!-- Top blade -->
    <polygon points="100,56 108,80 92,80"/>
    <!-- Bottom blade -->
    <polygon points="100,144 92,120 108,120"/>
    <!-- Top-right blade -->
    <polygon points="138,78 118,86 126,69"/>
    <!-- Bottom-left blade -->
    <polygon points="62,122 82,114 74,131"/>
    <!-- Top-left blade -->
    <polygon points="62,78 82,86 74,69"/>
    <!-- Bottom-right blade -->
    <polygon points="138,122 118,114 126,131"/>
  </g>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="34" stroke="rgba(0,212,255,0.6)" stroke-width="1" fill="rgba(0,212,255,0.03)"/>

  <!-- Center glow circle -->
  <circle cx="100" cy="100" r="20" fill="url(#center-grad)" filter="url(#center-glow)"/>
  <circle cx="100" cy="100" r="20" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.9"/>

  <!-- Center bright core -->
  <circle cx="100" cy="100" r="10" fill="#00d4ff" opacity="0.7" filter="url(#center-glow)"/>
  <circle cx="100" cy="100" r="5" fill="white" opacity="0.9"/>
</svg>
